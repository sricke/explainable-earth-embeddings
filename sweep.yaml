program: main.py
method: grid
metric:
  name: val_loss
  goal: minimize

parameters:
  dataset_path:
    values:
      - /path/to/laion_rs
      - /path/to/bigearth
      - /path/to/skyscript
      - /path/to/rs5m
      - /path/to/lhrs_align

  # --- Loss ---
  train_loss:
    values: [clip, mse, concept]
  lambda_alignment:
    value: 0.1    # used only when train_loss=concept
  sigma:
    value: 1.0    # used only when train_loss=concept
  logit_scale_temp:
    value: 0.07

  # --- Location encoder projection ---
  location_encoder:
    value: satclip
  location_projection:
    values: [none, linear, mlp]
  loc_proj_hidden_layers:
    value: 1
  loc_proj_hidden_features:
    value: 512

  # --- Text encoder projection ---
  text_encoder:
    value: open_clip
  text_projection:
    values: [linear, mlp]
  text_proj_hidden_layers:
    value: 1
  text_proj_hidden_features:
    value: 512

  # --- Shared ---
  shared_dim:
    value: 256
  finetune_mode:
    value: only_proj

  # --- Training ---
  num_epochs:
    value: 10
  batch_size:
    value: 256
  lr:
    value: 0.0001
  weight_decay:
    value: 0.01
  num_workers:
    value: 4
  seed:
    value: 42
  device:
    value: cuda

  wandb_project:
    value: explainable-earth-embeddings
