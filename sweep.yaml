program: main.py
entity: boulder-rolf-lab
project: explainable-earth-embeddings
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
method: grid
metric:
  name: val_loss
  goal: minimize

parameters:
  dataset_path:
    values:
      - /home/libe2152/data/skyscript/satclip/open_clip/
  precomputed_text_embeddings:
    value: true
  precomputed_location_embeddings:
    value: true

  # --- Loss ---
  train_loss:
    values: [clip, mse, concept]
  lambda_alignment:
    value: 1.0  
  sigma:
    value: 1.0
  logit_scale_temp:
    value: 0.07 # same as geoclip

  # --- Location encoder projection ---
  location_encoder:
    value: satclip
  location_projection:
    values: [none, linear]
  loc_proj_hidden_layers: # only used for mlp projection
    value: 1
  loc_proj_hidden_features: # only used for mlp projection
    value: 512

  # --- Text encoder projection ---
  text_encoder:
    value: open_clip
  text_projection:
    values: [linear, mlp]
  text_nonlinearity:
    value: relu
  text_proj_hidden_layers: # only used for mlp projection
    value: 1
  text_proj_hidden_features: # only used for mlp projection
    value: 512

  # --- Shared ---
  shared_dim:
    value: 256
  text_finetune_mode:
    values: [all]
  loc_finetune_mode:
    value: only_proj
  lora_rank:
    value: 0  # set to e.g. 4 to enable LoRA (requires text_finetune_mode=all)

  # --- Training ---
  num_epochs:
    value: 500
  patience:
    value: -1 # no patience
  batch_size:
    value: 256
  lr:
    value: 0.0001
  weight_decay:
    value: 0.01
  num_workers:
    value: 4
  seed:
    value: 42
  device:
    value: cuda

  wandb_entity:
    value: boulder-rolf-lab
  wandb_project:
    value: explainable-earth-embeddings
