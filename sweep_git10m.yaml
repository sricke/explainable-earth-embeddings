program: main.py
entity: boulder-rolf-lab
project: explainable-earth-embeddings
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
method: grid
metric:
  name: val_loss
  goal: minimize

parameters:
  dataset_path:
    values:
      - /home/libe2152/data/expanded-git-10M/
  train_subsample_size:
    value: None
  val_subsample_size:
    value: None
  precomputed_text_embeddings:
    value: true
  precomputed_location_embeddings:
    value: true

  # --- Loss ---
  train_loss:
    values: [clip]
  lambda_alignment:
    value: 1.0  
  sigma:
    value: 1.0
  logit_scale_temp:
    value: 0.07 # same as geoclip

  # --- Location encoder projection ---
  location_encoder:
    value: satclip
  location_projection:
    values: [none]
  loc_nonlinearity:
    value: sine
  loc_proj_hidden_layers: # only used for mlp projection
    value: 1
  loc_proj_hidden_features: # only used for mlp projection
    value: 512

  # --- Text encoder projection ---
  text_encoder:
    value: open_clip
  text_projection:
    values: [mlp]
  text_nonlinearity:
    value: gelu
  text_proj_hidden_layers: # only used for mlp projection
    value: 1
  text_proj_hidden_features: # only used for mlp projection
    value: 2048

  # --- Shared ---
  shared_dim:
    value: 256
  text_finetune_mode:
    values: only_proj
  loc_finetune_mode:
    value: only_proj
  lora_rank:
    values: None

  # --- Training ---
  num_epochs:
    value: 500
  patience:
    value: 5
  batch_size:
    value: 4096 
  accumulation_steps:
    value: 8
  lr:
    value: 0.001
  scheduler:
    value: cosine
  warmup_epochs:
    value: 5
  weight_decay:
    value: 0.01
  num_workers:
    value: 4
  seed:
    value: 42
  device:
    value: cuda

  wandb_entity:
    value: boulder-rolf-lab
  wandb_project:
    value: explainable-earth-embeddings
