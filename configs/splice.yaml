# configs/splice.yaml

device: "cuda"
num_samples: 10000      # set to null to use all rows
max_vocab_size: 15000
batch_size: 100

dataset_csv: "../../data/s2-100k/ee-dataset/dataset.csv"

models:
  - label: "geoclip_pretrained"
    ckpt_path: "location2text_pretrained.ckpt"

vocab_dirs:
  - "text-descriptions-wikipedia"
  - "text-descriptions-ee"

l1_penalties: [0.35, 0.25, 0.15]

known_locations:
  "New York City": [40.7128, -74.0060]
  "Paris": [48.8566, 2.3522]
  "Tokyo": [35.6895, 139.6917]
  "Sydney": [-33.8688, 151.2093]
  "Cairo": [30.0444, 31.2357]
  "London": [51.5074, -0.1278]
  "Los Angeles": [34.0522, -118.2437]
  "Rio de Janeiro": [-22.9068, -43.1729]
  "Delhi": [28.7041, 77.1025]
  "Shanghai": [31.2304, 121.4737]
  "Himilayas": [30.427193, 95.643024]

output:
  parquet_dir: "splice_outputs"
  report_dir: "splice_reports"