# lightning.pytorch==2.6.1
seed_everything: 42
trainer:
  accelerator: gpu
  strategy: auto
  devices:
  - 2
  num_nodes: 1
  precision: null
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: null
      save_dir: .
      version: null
      offline: false
      dir: null
      id: null
      anonymous: null
      project: explainable-earth-embeddings
      log_model: all
      experiment: null
      prefix: ''
      checkpoint_name: null
      add_file_policy: mutable
      entity: boulder-rolf-lab
      notes: null
      tags: null
      config: null
      config_exclude_keys: null
      config_include_keys: null
      allow_val_change: null
      group: null
      job_type: null
      mode: null
      force: null
      reinit: null
      resume: null
      resume_from: null
      fork_from: null
      save_code: null
      tensorboard: null
      sync_tensorboard: null
      monitor_gym: null
      settings: null
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: ../../outputs/explainable-earth-embeddings/geoyfcc-text/checkpoints
      filename: Text2Location-{epoch:02d}-{val_loss:.4f}
      monitor: val_loss
      verbose: false
      save_last: true
      save_top_k: 1
      save_on_exception: false
      save_weights_only: false
      mode: min
      auto_insert_metric_name: true
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val_loss
      min_delta: 0.0
      patience: 5
      verbose: false
      mode: min
      strict: true
      check_finite: true
      stopping_threshold: null
      divergence_threshold: null
      check_on_train_epoch_end: null
      log_rank_zero_only: false
  fast_dev_run: false
  max_epochs: 200
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 10
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
model:
  location_model_type: satclip
  location_model: microsoft/SatCLIP-ViT16-L40
  location_model_filename: satclip-vit16-l40.ckpt
  text_model_type: geoclip
  text_model: geoclip
  text_vocabulary: openai
  train_text_model: true
  finetune_mode: geoclip_text_mlp_only
  learning_rate: 0.0001
  weight_decay: 0.01
  logit_scale_temperature: 0.07
  lambda_alignment: 0.0
  sigma: 1.0
data:
  data_path: ../../data/geoyfcc/
  dataset_name: GeoYFCC-Text
  batch_size: 512
  num_workers: 6
  transform: null
  mode: both
optimizer: null
lr_scheduler: null
