base: /media/volume/xAi-data
data_dir: "${base}/data"
projects_dir: "${base}/projects"

data:
  root: "${data_dir}"
  skyscript: "${root}/skyscript"
  git10m: "${root}/git-10M"
  shapefile: "${root}/shapefiles/ne_110m_admin_0_countries.shp"

models:
  root: "${base}/outputs/explainable-earth-embeddings"

  satclip_open_clip_vit_h:
    model_path: "${root}/git-10M/txt-open_clip_vit_h__loc-satclip__tproj-linear__lproj-none__tft-lora__lft-only_proj__lora_r-8__loss-clip_symmetric__lr-0.0001__h-4bb7c457/best.pt"
  geoclip:
    model_path: "${root}/geoclip_init.pt"

location_encoders:
  csp_root: "${data_dir}/csp/model_dir"
  csp_fmow: "${csp_root}/model_fmow/model_fmow_gridcell_0.0010_32_0.1000000_1_512_gelu_UNSUPER-contsoftmax_0.000050_1.000_1_0.100_TMP1.0000_1.0000_1.0000.pth.tar"
  csp_inat: "${csp_root}/model_inat/model_inat_2018_gridcell_0.0010_32_0.1000000_1_512_leakyrelu_UNSUPER-contsoftmax_0.000500_1.000_1_1.000_TMP20.0000_1.0000_1.0000.pth.tar"

concept_sets:
  git-10m:
    root: "${projects_dir}/explainable-earth-embeddings/data/git-10m/concept_dictionaries"
    geospatial_all: "${root}/concept_dictionary_n500000.json"
    geospatial: "${root}/augmented_concepts.json"

  geoyfcc:
    geoyfcc: "${projects_dir}/eda/0_vocabs/geoyfcc_concept_set.json"

splice:
  root: "${projects_dir}/explainable-earth-embeddings/splice_results"

  geoclip_geospatial_all:
    model: "${root}/geoclip/concept_dictionary_n500000/splice_model.pt"
    concepts: "${root}/geoclip/concept_dictionary_n500000/concepts.pt"

  geoclip_geoyfcc:
    model: "${root}/geoclip/geoyfcc_concept_set/splice_model.pt"
    concepts: "${root}/geoclip/geoyfcc_concept_set/concepts.pt"

  satclip_geospatial:
    model: "${root}/txt-open_clip_vit_h__loc-satclip__tproj-linear__lproj-none__tft-lora__lft-only_proj__lora_r-8__loss-clip_symmetric__lr-0.0001__h-4bb7c457/augmented_concepts/splice_model.pt"
    concepts: "${root}/txt-open_clip_vit_h__loc-satclip__tproj-linear__lproj-none__tft-lora__lft-only_proj__lora_r-8__loss-clip_symmetric__lr-0.0001__h-4bb7c457/augmented_concepts/concepts.pt"

  satclip_geospatial_all:
    model: "${root}/txt-open_clip_vit_h__loc-satclip__tproj-linear__lproj-none__tft-lora__lft-only_proj__lora_r-8__loss-clip_symmetric__lr-0.0001__h-4bb7c457/concept_dictionary_n500000/splice_model.pt"
    concepts: "${root}/txt-open_clip_vit_h__loc-satclip__tproj-linear__lproj-none__tft-lora__lft-only_proj__lora_r-8__loss-clip_symmetric__lr-0.0001__h-4bb7c457/concept_dictionary_n500000/concepts.pt"
